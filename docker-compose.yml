services:
  client:
    build:
      context: ./electro-frontend
      dockerfile: Dockerfile
    container_name: electro-client
    ports:
      - "3000:80" 
    networks:
      - electro-network
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: ./Project/electro
      dockerfile: Dockerfile
    container_name: electro-server
    ports:
      - "8080:8080" 
    networks:
      - electro-network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/electrodb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8080
      SPRING_WEB_CORS_ALLOWED_ORIGINS: http://localhost:3000
      APP_TEST_DATA_ENABLED: "true"
      TZ: Europe/Moscow
    volumes:
      - ./images:/app/images:ro
      - ./Project/electro/uploads:/app/uploads

  db:
    image: postgres:15-alpine 
    container_name: electro-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: electrodb      
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d electrodb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "5433:5432"         
    volumes:
      - electro_postgres_data:/var/lib/postgresql/data
    networks:
      - electro-network
    restart: unless-stopped

networks:
  electro-network:
    driver: bridge
    name: electro-network

volumes:
  electro_postgres_data:
    name: electro-postgres-data











